<body>
<div class="ambient" aria-hidden="true"></div>
<div class="book">
  <header class="masthead">
    
    <div class="masthead-top">
      
      <div class="archive-actions">
        <button type="button" class="tiny-action" id="backupBtn" title="Exportar todas as fichas em JSON" aria-label="Exportar backup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12m-5-5 5 5 5-5M5 17v3h14v-3"/></svg>
          <span>Exportar</span>
        </button>
        <button type="button" class="tiny-action" id="restoreBtn" title="Importar backup de fichas" aria-label="Importar backup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 17V5m-5 5 5-5 5 5M5 17v3h14v-3"/></svg>
          <span>Importar</span>
        </button>
        <input id="backupInput" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
    <h1><span>FICHA</span> <em>KNAVE</em></h1>
    
    <nav class="groups" aria-label="Grupos de personagens">
      <button type="button" class="group-chip active" data-filter="all">Todos <span class="chip-count" id="allCount">0</span></button>
      <button type="button" class="group-chip" data-filter="ungrouped">Sem grupo</button>
      <div id="groupList" class="group-list"></div>
      <button type="button" class="add-group" id="newGroupBtn" title="Criar um grupo">+ <span>Grupo</span></button>
    </nav>
  </header>

  <main class="collection">
    <div class="collection-heading">
      <div class="heading-text">
        
        <h2 id="sectionTitle">Seus personagens</h2>
        <span class="heading-count" id="visibleCount">0</span>
      </div>
      <button type="button" class="new-in-heading" id="newCharacterBtn">+ Personagem</button>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.3 15.3 5 5"/></svg>
        <input id="searchInput" type="search" placeholder="Buscar personagem..." aria-label="Buscar personagem">
      </label>
    </div>

    <section class="character-grid" id="characterGrid" aria-label="Fichas dos personagens"></section>
    <div class="no-results" id="emptyState" hidden>
      <span class="no-results-symbol">✧</span>
      <h3>Nenhum personagem encontrado</h3>
      <p>Crie um personagem ou selecione outro grupo.</p>
      <button type="button" class="text-link" id="emptyCreateBtn">Criar personagem <span aria-hidden="true">↗</span></button>
    </div>
  </main>
  
</div>

<dialog id="characterDialog" class="dialog">
  <form method="dialog" id="createForm">
    
    <div class="dialog-overline">CRIAR PERSONAGEM</div>
    <h2>Criar personagem</h2>
    <p>Nome e grupo da ficha.</p>
    <label>Nome do personagem<input id="characterName" required maxlength="80" autocomplete="off" placeholder="Nome do personagem"></label>
    <label>Grupo<select id="characterGroup"></select></label>
    <div class="dialog-actions">
      <button type="button" class="btn-quiet" data-close="characterDialog">Cancelar</button>
      <button type="submit" class="btn-gold">Criar ficha <span>→</span></button>
    </div>
  </form>
</dialog>

<dialog id="transferDialog" class="dialog">
  <form method="dialog" id="transferForm">
    
    <div class="dialog-overline" id="transferKicker">ORGANIZAR PERSONAGEM</div>
    <h2 id="transferTitle">Mover personagem</h2>
    <p id="transferInfo"></p>
    <label>Grupo de destino<select id="targetGroup"></select></label>
    <div class="dialog-actions">
      <button type="button" class="btn-quiet" data-close="transferDialog">Cancelar</button>
      <button type="submit" class="btn-gold" id="transferConfirm">Confirmar <span>→</span></button>
    </div>
  </form>
</dialog>

<div id="pageTransition" class="page-transition" aria-hidden="true">
  <div class="transition-content">
    <div class="transition-symbol">X</div>
    <span>ABRINDO FICHA</span>
    <strong id="transitionName">Personagem</strong>
    <div class="transition-line"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
